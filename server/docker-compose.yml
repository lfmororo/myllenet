services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: myllenet
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: myllenet
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "127.0.0.1:5432:5432"

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: myllenet
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: myllenet
      JWT_SECRET: ${JWT_SECRET}
      CRON_SECRET: ${CRON_SECRET}
      BACKUP_DIR: /app/backups
      PORT: 3333
      APP_BASE_URL: ${APP_BASE_URL}
      EFI_CLIENT_ID: ${EFI_CLIENT_ID}
      EFI_CLIENT_SECRET: ${EFI_CLIENT_SECRET}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN}
      UAZAPI_TOKEN: ${UAZAPI_TOKEN}
    volumes:
      - backups_data:/app/backups
    ports:
      - "3333:3333"

volumes:
  pg_data:
  backups_data:
