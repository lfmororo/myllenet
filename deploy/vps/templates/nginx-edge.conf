# myllenet-web — borda do MyLLENET atrás do Traefik do Easypanel
# - __APP_DOMAIN__  -> front (React/Vite, arquivos estáticos)
# - __API_DOMAIN__  -> Supabase do MyLLENET (container myllenet-envoy)

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# DNS interno do Docker: resolve myllenet-envoy mesmo se ele reiniciar
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  server_name __API_DOMAIN__;

  client_max_body_size 50m;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;

  location / {
    set $upstream http://myllenet-envoy:8000;
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
  }
}

server {
  listen 80 default_server;
  server_name __APP_DOMAIN__;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA: rotas do React Router (/fatura/:id, /diagnostico, ...)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
